# Server-level config for the supervised gateway session.
#
# This sources the personal config verbatim, then re-applies the handful of
# settings the long-running-agent use case depends on. Keeping them here rather
# than editing tmux.conf means that file stays a straight copy of the desktop
# config and can be re-synced without re-patching it.

source-file /etc/gateway/tmux.conf

# The desktop config sets default-shell from $SHELL, which is empty in the
# container and makes tmux fail to parse. Pin it explicitly.
set-option -g default-shell /bin/bash

# Agents emit a lot of output and sessions live for weeks, not hours.
set-option -g history-limit 200000

# Don't let a crashed agent silently vanish; the pane stays so its last output
# is still readable after the process dies.
set-option -g remain-on-exit on

# Long-lived panes get named by hand to track which fleet they're driving.
set-window-option -g automatic-rename off
set-option -g allow-rename off

# pbcopy isn't present on Linux; copy to a tmux buffer instead so the
# copy-mode bindings from the desktop config still do something useful.
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd3Pane send -X copy-selection-and-cancel

# The desktop binding reloads ~/.tmux.conf, which isn't where this lives.
bind-key -n M-g source-file /etc/gateway/gateway.tmux.conf \; display-message "Reloaded gateway config"
